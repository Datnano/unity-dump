name: Dump IL2CPP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Download release v1 files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download v1 --repo ${{ github.repository }} -p "libil2cpp.so" -p "global-metadata.dat"
          ls -lh libil2cpp.so global-metadata.dat

      - name: Run Cpp2IL
        run: |
          git clone --depth 1 https://github.com/SamboyCoding/Cpp2IL.git
          dotnet run --project Cpp2IL/Cpp2IL/Cpp2IL.csproj --framework net10.0 -c Release -- \
            --force-binary-path libil2cpp.so \
            --force-metadata-path global-metadata.dat \
            --force-unity-version 6000.6.9 \
            --output-as dummydll \
            --output-to out

      - name: Export dump.cs with ilspycmd
        run: |
          dotnet tool install -g ilspycmd
          ~/.dotnet/tools/ilspycmd out/Assembly-CSharp.dll > dump.cs
          ls -lh dump.cs

      - name: Upload dump.cs artifact
        uses: actions/upload-artifact@v4
        with:
          name: dump-cs
          path: dump.cs
